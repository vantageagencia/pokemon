<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Clone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #game-wrapper {
            position: relative;
            border: 4px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #controls-info {
            position: fixed;
            bottom: 10px;
            color: #666;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>
    <div id="controls-info">
        Arrow Keys: Move | Z: Confirm/Action | X: Cancel/Back | Enter: Start Menu | Space: Run (hold)
    </div>

    <!-- Engine -->
    <script src="src/engine/constants.js"></script>
    <script src="src/engine/utils.js"></script>
    <script src="src/engine/input.js"></script>
    <script src="src/engine/audio.js"></script>
    <script src="src/engine/spriteRenderer.js"></script>
    <script src="src/engine/camera.js"></script>
    <script src="src/engine/textBox.js"></script>

    <!-- Data -->
    <script src="src/data/typeChart.js"></script>
    <script src="src/data/moves.js"></script>
    <script src="src/data/pokemon.js"></script>
    <script src="src/data/items.js"></script>
    <script src="src/data/trainerData.js"></script>

    <!-- Sprites -->
    <script src="src/sprites/pokemonSprites.js"></script>
    <script src="src/sprites/characterSprites.js"></script>
    <script src="src/sprites/tileSprites.js"></script>

    <!-- Maps -->
    <script src="src/maps/mapData.js"></script>
    <script src="src/maps/mapRenderer.js"></script>

    <!-- Systems -->
    <script src="src/systems/player.js"></script>
    <script src="src/systems/pokemon.js"></script>
    <script src="src/systems/battle.js"></script>
    <script src="src/systems/wildEncounter.js"></script>
    <script src="src/systems/npc.js"></script>
    <script src="src/systems/inventory.js"></script>
    <script src="src/systems/saveLoad.js"></script>
    <script src="src/systems/evolution.js"></script>

    <!-- UI -->
    <script src="src/ui/battleUI.js"></script>
    <script src="src/ui/menuUI.js"></script>
    <script src="src/ui/partyUI.js"></script>
    <script src="src/ui/bagUI.js"></script>
    <script src="src/ui/pokedexUI.js"></script>
    <script src="src/ui/shopUI.js"></script>
    <script src="src/ui/titleScreen.js"></script>

    <!-- Main -->
    <script src="src/game.js"></script>
</body>
</html>
